# Box tree. Reads anvil-dom and anvil-style.
# Text width comes from anvil-ttf. Image intrinsic sizes come from anvil-image.
# anvil-paint walks the boxes this crate returns. This crate does not paint pixels.

[package]
name = "anvil-layout"
description = "Block, inline, flex, grid, table, and positioned boxes."
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "LicenseRef-Proprietary"
publish.workspace = true

[dependencies]
anvil-dom = { path = "../anvil-dom" }
anvil-style = { path = "../anvil-style" }
anvil-image.workspace = true
anvil-ttf.workspace = true
