# CSS parser and cascade. Reads anvil-dom nodes. Does not place boxes.
# anvil-layout reads the computed style. anvil-raster also reads style values
# that the display list did not fully flatten.

[package]
name = "anvil-style"
description = "CSS cascade and media queries."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "LicenseRef-PolyForm-Noncommercial-1.0.0-OR-Commercial"
publish.workspace = true

[dependencies]
anvil-css.workspace = true
anvil-dom = { path = "../anvil-dom" }
